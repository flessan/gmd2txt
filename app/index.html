<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ee">
  <meta name="application-name" content="GMDPlayer">
  <meta name="description" content="A local-first workstation for Geometry Dash files.">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/gmdplayer-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/gmdplayer-192.png">
  <title>GMDPlayer — Geometry Dash workstation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/gmdplayer.css">
  <script src="./app-meta.js"></script>
  <script src="./play/assets/scripts/libs/pako.min.js"></script>
  <script>
    (() => {
      const app = document.getElementById("app");
      let handled = false;
      const showBootFailure = (message) => {
        if (handled || !app) return;
        if (!app.innerHTML || app.querySelector(".boot-screen")) {
          handled = true;
          app.innerHTML =
            '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#f4f3ee;color:#17352d;font-family:Poppins,system-ui,sans-serif">' +
            '<section style="width:min(680px,100%);padding:32px;border:1px solid #d8ded8;border-radius:14px;background:#fff;box-shadow:0 12px 40px rgba(23,53,45,.08)">' +
            '<div style="font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6c7b74">GMDPlayer startup</div>' +
            '<h1 style="margin:8px 0 10px;font-size:30px">The app could not start.</h1>' +
            '<p style="margin:0 0 18px;color:#5f6d67;line-height:1.6">The page loaded, but the application module did not finish starting. This is a browser/runtime error, not a file upload problem.</p>' +
            '<details style="margin:0 0 20px"><summary style="cursor:pointer;font-weight:600">Diagnostic</summary><pre style="white-space:pre-wrap;overflow:auto;margin-top:10px;padding:12px;border-radius:8px;background:#f6f7f4;color:#36433e">' +
            String(message || "Unknown startup error").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") +
            '</pre></details>' +
            '<p style="margin:0;display:flex;gap:10px;flex-wrap:wrap"><a href="/app/?reload=' + Date.now() + '" style="display:inline-block;padding:11px 16px;border-radius:8px;background:#24785f;color:#fff;text-decoration:none;font-weight:600">Reload GMDPlayer</a><a href="/app/" style="display:inline-block;padding:11px 16px;border:1px solid #cfd7d1;border-radius:8px;color:#17352d;text-decoration:none;font-weight:600">Open /app/</a></p>' +
            '</section></main>';
        }
      };
      window.addEventListener("error", event => {
        if (event?.error || event?.message) showBootFailure(event.error?.stack || event.message);
      });
      window.addEventListener("unhandledrejection", event => {
        showBootFailure(event.reason?.stack || event.reason?.message || String(event.reason || "Unhandled promise rejection"));
      });
      window.setTimeout(() => {
        if (!app || (!app.innerHTML || app.querySelector(".boot-screen"))) {
          showBootFailure("GMDPlayer did not finish initializing within 8 seconds.");
        }
      }, 8000);
    })();
  </script>
  <script type="module" src="./shell/main.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="toast-region" aria-live="polite"></div>
  <div id="operation-region" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".gmd,.txt,.dat,.png,.plist,.zip,.gmdproject,.mp3,.ogg,.opus,.wav,.m4a,.mp4,.aac,.flac,.webm,text/plain,application/octet-stream,image/png,application/zip,audio/*" multiple hidden>
  <input type="file" id="audio-input" accept="audio/*,.mp3,.ogg,.opus,.wav,.m4a,.aac,.flac,.webm,.mp4" multiple hidden>
  <input type="file" id="replacement-input" accept=".png,image/png" hidden>
  <input type="file" id="project-input" accept=".gmdproject,application/zip" hidden>
  <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
</body>
</html>
